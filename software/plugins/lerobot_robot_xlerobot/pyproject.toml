[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_xlerobot"
version = "0.1.0"
description = "XLeRobot 3-omniwheel base robot plugin for lerobot (RobotConfig.register_subclass 'xlerobot')"
requires-python = ">=3.10"
dependencies = [
    "lerobot[feetech]",
    "pyzmq>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_xlerobot"]
