[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_xlerobot_2wheels"
version = "0.1.0"
description = "XLeRobot 2-wheel base robot plugin for lerobot (RobotConfig.register_subclass 'xlerobot_2wheels')"
requires-python = ">=3.10"
dependencies = [
    "lerobot[feetech]",
    "pyzmq>=25.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_xlerobot_2wheels"]
